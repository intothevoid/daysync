<svg width="600" height="800" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="600" height="800" fill="white"/>
    <text x="50" y="80" font-family="DejaVu Sans" font-size="48" font-weight="bold" fill="#333">{{.Name}}</text>
    <text x="50" y="150" font-family="DejaVu Sans" font-size="32" fill="#555">Qualifying: {{.Sessions.Q1}}</text>
    {{if .Sessions.Sprint}}
    <text x="50" y="200" font-family="DejaVu Sans" font-size="32" fill="#555">Sprint: {{.Sessions.Sprint}}</text>
    {{end}}
    <text x="50" y="250" font-family="DejaVu Sans" font-size="32" fill="#555">Race: {{.Sessions.Race}}</text>
</svg>
