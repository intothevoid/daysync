<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <style>
        .title { font: bold 48px sans-serif; fill: #333; }
        .details { font: 32px sans-serif; fill: #555; }
    </style>
    <text x="50" y="80" class="title">{{.Name}}</text>
    <text x="50" y="150" class="details">Qualifying: {{.Sessions.Q1}}</text>
    {{if .Sessions.Sprint}}
    <text x="50" y="200" class="details">Sprint: {{.Sessions.Sprint}}</text>
    {{end}}
    <text x="50" y="250" class="details">Race: {{.Sessions.Race}}</text>
</svg>
