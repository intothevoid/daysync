<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="800" height="600" fill="white"/>
    <text x="50" y="80" font-family="DejaVu Sans" font-size="48" font-weight="bold" fill="#333">{{.Name}}</text>
    <text x="50" y="150" font-family="DejaVu Sans" font-size="32" fill="#555">Q1: {{.Sessions.Q1}}</text>
    <text x="50" y="200" font-family="DejaVu Sans" font-size="32" fill="#555">Q2: {{.Sessions.Q2}}</text>
    <text x="50" y="250" font-family="DejaVu Sans" font-size="32" fill="#555">Sprint: {{.Sessions.Sprint}}</text>
    <text x="50" y="300" font-family="DejaVu Sans" font-size="32" fill="#555">Race: {{.Sessions.Race}}</text>
</svg>