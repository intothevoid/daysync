<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <style>
        .title { font: bold 48px sans-serif; fill: #333; }
        .details { font: 32px sans-serif; fill: #555; }
    </style>
    <text x="50" y="80" class="title">Finance</text>
    {{range .}}
    <text x="50" y="{{add .Y 150}}" class="details">{{.Symbol}}: {{.RegularMarketDayHigh}}</text>
    {{end}}
</svg>
