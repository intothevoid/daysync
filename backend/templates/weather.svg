<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="800" height="600" fill="white"/>
    <text x="50" y="80" font-family="DejaVu Sans" font-size="48" font-weight="bold" fill="#333">{{.Location.Name}}</text>
    <text x="50" y="150" font-family="DejaVu Sans" font-size="32" fill="#555">{{.Current.Condition.Text}}</text>
    <text x="50" y="200" font-family="DejaVu Sans" font-size="32" fill="#555">{{.Current.TempC}}°C</text>
    <image href="https://cdn.weatherapi.com/weather/64x64/{{.Current.Condition.Icon}}" x="50" y="220" height="64" width="64" />
</svg>
